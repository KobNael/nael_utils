sonar.cfamily.variants.names=Debug, Release
sonar.cfamily.variants.dir=compilation-databases
sonar.coverageReportPaths=compilation-databases/sonarqube.xml
sonar.cfamily.valgrind.reportsPaths=compilation-databases/**memcheck-results.xml
