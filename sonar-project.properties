sonar.projectKey=cpp-utils
sonar.projectName=C++ Toolbox
sonar.projectVersion=1.0.0
sonar.sources=src/nael_utils/src
sonar.tests=src/test/src

sonar.exclusions=src/app/src/**,src/test/**
sonar.coverage.exclusions=src/app/src/**,src/test/**
sonar.cpd.exclusions=src/app/src/**,src/test/**
