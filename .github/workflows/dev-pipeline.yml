# Workflow for C++ project
name: dev-pipeline

# Only for dev
on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]
    types: [opened, synchronize, reopened]

# List of actions
jobs:
  # Call pipeline
  cpp_pipeline:
    uses: KobNael/nael_cpp_action/.github/workflows/cpp-workflow.yml@dev
    with:
    #  CHECK_QUALITY_GATE: false
      RUN_SONAR: false
    secrets:
      GH_PAT: "${{ secrets.GH_PAT }}"
      SONAR_TOKEN: "${{ secrets.SONAR_TOKEN }}"
      SONAR_HOST_URL: "${{ secrets.SONAR_HOST_URL }}"
