# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMakeBuild

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest
    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false
      # Wanna build in Release And Debug
      matrix:
        build_type: [Debug]

    steps:
    # Checkout sources
    - name: checkout
      uses: actions/checkout@v4

    # Get c++ tools
    - name: Get C++ Tools
      run: sudo apt-get install -y gcc gcovr lcov libncurses5-dev cppcheck valgrind

    # Install conan
    - name: Get Conan
      uses: turtlebrowser/get-conan@main
      with:
        version: 1.63.0

    # Cach conan local repository
    - name: Cache conan dependencies
      id: cache-dependencies
      uses: actions/cache@v4
      with:
        # conan files are stored in `~/.conan` on Linux
        path: ~/.conan
        key: ${{ matrix.build_type}}-${{ hashFiles('**/conanfile.py') }}

    # If no cache found, generate profile
    - if: ${{ steps.cache-dependencies.outputs.cache-hit != 'true' }}
      name: Create default profile
      run: conan profile new default --detect

    # Install dependencies
    - if: ${{ matrix.build_type == 'Release' }}
      name: Install dependencies
      run: >
        conan install .
        -s build_type=${{matrix.build_type}}
        --install-folder=${{github.workspace}}/build
        --build=missing

    - if: ${{ matrix.build_type == 'Debug' }}
      name: Install dependencies
      run: >
        conan install .
        -s build_type=${{matrix.build_type}}
        --install-folder=${{github.workspace}}/build
        --build=missing
        -o coverage=ON
        -o cppcheck=ON
        -o valgrind=ON

    # Build
    - name: Build
      run: conan build . --install-folder=${{github.workspace}}/build
    # UnitTests
    - name: Run UnitTests
      working-directory: ${{github.workspace}}/builds/Linux/gcc/13/x86_64/${{matrix.build_type}}/_
      run: make run_unit_tests
    # CPPCheck
    - name: Run CppCheck
      working-directory: ${{github.workspace}}/builds/Linux/gcc/13/x86_64/${{matrix.build_type}}/_
      run: make run_cppcheck
    # Coverage
    - name: Run Coverage
      working-directory: ${{github.workspace}}/builds/Linux/gcc/13/x86_64/${{matrix.build_type}}/_
      run: make run_coverage
    # Memcheck
    - name: Run Valgrind
      working-directory: ${{github.workspace}}/builds/Linux/gcc/13/x86_64/${{matrix.build_type}}/_
      run: make run_memcheck
